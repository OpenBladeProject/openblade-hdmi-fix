name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OpenBlade.HdmiFix.slnx -p:NuGetAudit=false
      - run: dotnet build OpenBlade.HdmiFix.slnx -c Release -p:NuGetAudit=false --no-restore
      - run: dotnet test OpenBlade.HdmiFix.slnx -c Release -p:NuGetAudit=false --no-build --no-restore
      - name: Check package provenance guards
        shell: pwsh
        run: ./build/Publish.Tests.ps1
      - name: Package Windows app
        shell: pwsh
        run: ./build/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: openblade-hdmi-fix-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
